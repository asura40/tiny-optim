[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-optim"
version = "0.2.0"
description = "First-order optimizers from scratch in pure Python: SGD, Momentum, Adam, and Muon."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.setuptools]
packages = ["tiny_optim"]
